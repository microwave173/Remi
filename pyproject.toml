[project]
name = "ai-girl-agent"
version = "0.1.0"
description = "A practical personality-memory-emotion agent powered by qwen3-vl-flash"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "ddgs>=9.0.0",
  "duckduckgo-search>=6.2.9",
]

[project.scripts]
ai-girl = "ai_girl_agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
